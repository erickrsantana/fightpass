<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FightPass - Mapa da Plataforma</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="light-theme app-shell" data-page="mapa-plataforma">
    <main class="main-content">
        <header class="page-hero page-hero-map">
            <h1>Mapa de academias</h1>
            <p>Passe o mouse sobre uma academia para ver quantas pessoas ha nela.</p>
        </header>

        <div id="map-message" hidden></div>

        <div class="map-layout">
            <section class="card-white map-panel">
                <div id="map-view" style="min-height: 480px;"></div>
            </section>

            <aside>
                <div id="institution-list"></div>
            </aside>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/logos.js"></script>
    <script src="js/mapa-plataforma.js"></script>
</body>
</html>
