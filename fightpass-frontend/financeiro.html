<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FightPass - Financeiro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="light-theme app-shell" data-page="financeiro">
    <main class="main-content">
        <header class="page-hero page-hero-schedule">
            <h1 style="font-size: 28px; color: #1E293B;">Financeiro</h1>
            <p>Acompanhe quanto sua academia vai receber pelas aulas dos alunos do FightPass.</p>
        </header>

        <div id="finance-message" hidden></div>

        <section class="card-white" style="padding: 24px; margin-bottom: 24px;">
            <div class="button-row" style="justify-content: space-between; align-items: flex-end;">
                <div class="input-group" style="margin-bottom: 0; max-width: 220px;">
                    <label for="finance-month">Mes de referencia</label>
                    <input id="finance-month" type="month" class="input-field">
                </div>
                <div id="finance-payout" style="color: #64748B; font-size: 14px;"></div>
            </div>
        </section>

        <div id="finance-cards" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; margin-bottom: 24px;"></div>

        <section class="card-white" style="padding: 24px; margin-bottom: 24px;">
            <h2 style="font-size: 18px; margin-bottom: 8px; color: #1E293B;">Como o valor e calculado</h2>
            <p id="finance-note" style="color: #64748B; line-height: 1.6;"></p>
        </section>

        <section class="card-white" style="padding: 24px; margin-bottom: 24px;">
            <h2 style="font-size: 18px; margin-bottom: 16px; color: #1E293B;">Lancamentos do mes</h2>
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Aluno</th>
                        <th>Aula</th>
                        <th>Plano</th>
                        <th>Valor da aula</th>
                        <th>Taxa FightPass</th>
                        <th>Voce recebe</th>
                        <th>Situacao</th>
                    </tr>
                </thead>
                <tbody id="finance-table"></tbody>
            </table>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/financeiro.js"></script>
</body>
</html>
