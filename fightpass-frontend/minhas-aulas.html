<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FightPass - Minhas Aulas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="light-theme app-shell" data-page="minhas-aulas">
    <main class="main-content">
        <header class="page-hero page-hero-schedule">
            <h1 style="font-size: 28px;">Minhas aulas</h1>
            <p>Gerencie seus agendamentos, cancelamentos e lembretes de aula.</p>
        </header>

        <div id="my-classes-message" hidden></div>
        <section id="class-reminders" class="card-white" style="margin-bottom: 20px;" hidden></section>

        <section class="card-white" style="margin-bottom: 20px;">
            <div class="chip-row" id="period-chips" style="margin-top:0;">
                <button type="button" class="chip active" data-period="upcoming">Proximas</button>
                <button type="button" class="chip" data-period="past">Passadas</button>
                <button type="button" class="chip" data-period="all">Todas</button>
            </div>
            <div class="filter-grid">
                <div class="input-group"><label for="filter-modality">Modalidade</label>
                    <select id="filter-modality" class="input-field"><option value="">Todas</option></select></div>
                <div class="input-group"><label for="filter-institution">Academia</label>
                    <select id="filter-institution" class="input-field"><option value="">Todas</option></select></div>
                <div class="input-group"><label for="filter-from">De</label>
                    <input id="filter-from" type="date" class="input-field"></div>
                <div class="input-group"><label for="filter-to">Ate</label>
                    <input id="filter-to" type="date" class="input-field"></div>
            </div>
            <div class="button-row" style="justify-content: space-between; align-items:center; margin-top: 8px;">
                <small id="filter-count" class="muted-note"></small>
                <button type="button" id="filter-clear" class="btn-secondary" style="width:auto; padding: 8px 16px;">Limpar filtros</button>
            </div>
        </section>

        <div class="card-white">
            <div id="bookings-tree"></div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/pages.js"></script>
</body>
</html>
