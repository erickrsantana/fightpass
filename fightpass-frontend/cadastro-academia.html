<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FightPass - Cadastrar academia</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .register-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .register-card {
            background: white;
            border-radius: 12px;
            padding: 42px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.03);
            border: 1px solid #E2E8F0;
        }
    </style>
</head>
<body class="light-theme auth-page" data-page="cadastro-academia">
    <div class="register-container">
        <main class="register-card">
            <header style="text-align: center; margin-bottom: 30px;">
                <div class="logo" style="margin-bottom: 10px;">FightPass</div>
                <h1 style="font-size: 24px; color: #1E293B; margin-bottom: 5px;">Cadastrar academia</h1>
                <p style="color: #64748B; font-size: 14px;">Cadastre sua academia para aparecer no mapa e receber alunos.</p>
            </header>

            <div id="register-message" hidden></div>

            <form id="academy-form">
                <div class="input-group">
                    <label for="academy-institution-name">Nome da academia</label>
                    <input id="academy-institution-name" type="text" name="institutionName" class="input-field" placeholder="Ex.: Dojo Santo Amaro" required minlength="3">
                </div>

                <div class="input-group">
                    <label for="academy-zip">CEP</label>
                    <input id="academy-zip" type="text" name="zipCode" class="input-field" placeholder="00000-000" required inputmode="numeric" maxlength="9">
                </div>

                <div class="input-group">
                    <label for="academy-number">Número</label>
                    <input id="academy-number" type="text" name="number" class="input-field" placeholder="Ex.: 823" required>
                </div>

                <div class="input-group">
                    <label for="academy-complement">Complemento (opcional)</label>
                    <input id="academy-complement" type="text" name="complement" class="input-field" placeholder="Sala, bloco...">
                </div>

                <div class="input-group">
                    <label>Modalidades oferecidas</label>
                    <div id="academy-modalities" class="button-row"></div>
                </div>

                <div class="input-group">
                    <label for="academy-document">CNPJ ou CPF do responsável</label>
                    <input id="academy-document" type="text" name="document" class="input-field" placeholder="00.000.000/0000-00" required>
                </div>

                <div class="input-group">
                    <label for="academy-name">Nome do responsável</label>
                    <input id="academy-name" type="text" name="name" class="input-field" placeholder="Ex.: Maria Silva" required>
                </div>

                <div class="input-group">
                    <label for="academy-email">Email</label>
                    <input id="academy-email" type="email" name="email" class="input-field" placeholder="contato@suaacademia.com" required>
                </div>

                <div class="input-group">
                    <label for="academy-phone">Telefone</label>
                    <input id="academy-phone" type="text" name="phone" class="input-field" placeholder="(11) 99999-9999">
                </div>

                <div class="input-group">
                    <label for="academy-password">Senha</label>
                    <input id="academy-password" type="password" name="password" class="input-field" placeholder="Minimo de 8 caracteres, letra maiuscula e numero" required minlength="8">
                    <label class="inline-check" for="show-academy-password">
                        <input id="show-academy-password" type="checkbox">
                        <span>Mostrar senha digitada</span>
                    </label>
                </div>

                <div id="register-terms" hidden></div>

                <button type="submit" class="btn-primary" style="margin-top: 12px;">Cadastrar academia</button>

                <div style="text-align: center; margin-top: 25px; font-size: 14px; color: #64748B;">
                    Já tem conta?
                    <a href="login.html" style="color: #3B82F6; font-weight: 600; margin-left: 5px;">Entrar</a>
                    &middot;
                    <a href="cadastro.html" style="color: #3B82F6; font-weight: 600;">Sou aluno</a>
                </div>
            </form>
        </main>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/terms.js"></script>
    <script src="js/pages.js"></script>
</body>
</html>
