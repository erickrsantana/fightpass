<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FightPass - Plataforma</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="light-theme app-shell" data-page="plataforma">
    <main class="main-content">
        <header class="page-hero page-hero-home">
            <h1>Home FightPass</h1>
            <p>Visao geral da plataforma: usuarios cadastrados e academias.</p>
        </header>
        <div id="platform-message" hidden></div>

        <div class="metrics-grid" id="platform-metrics"></div>

        <section class="card-white" style="margin-top: 24px;">
            <h2>Usuarios por tipo</h2>
            <div id="platform-roles" style="margin-top: 12px;"></div>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/plataforma.js"></script>
</body>
</html>
