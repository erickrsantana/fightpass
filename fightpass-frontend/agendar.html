<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FightPass - Agendar Aula</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="light-theme app-shell" data-page="agendar">
    <main class="main-content">
        <header class="page-hero page-hero-schedule">
            <h1 style="font-size: 28px;">Agendar aula</h1>
            <p>Escolha uma academia perto de voce, veja as aulas e confirme seu agendamento.</p>
        </header>

        <div id="booking-message" hidden></div>

        <section class="card-white" style="margin-bottom: 24px;">
            <div class="button-row" style="justify-content: space-between; margin-bottom: 16px;">
                <h2 style="font-size: 20px;">1. Academias perto de voce</h2>
                <button id="use-location" type="button" class="btn-secondary" style="width:auto; padding: 10px 18px;">Usar minha localizacao</button>
            </div>
            <p id="location-status" style="color: #64748B; margin-bottom: 16px;"></p>
            <div id="institution-list" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px;"></div>
        </section>

        <section id="classes-section" class="card-white" style="margin-bottom: 24px;" hidden>
            <h2 id="classes-title" style="font-size: 20px; margin-bottom: 16px;">2. Aulas</h2>
            <div id="classes-list"></div>
        </section>

        <section id="booking-section" class="card-white" style="margin-bottom: 24px; max-width: 560px;" hidden>
            <h2 style="font-size: 20px; margin-bottom: 8px;">3. Confirmar agendamento</h2>
            <p id="selected-class" style="color: #64748B; margin-bottom: 20px;"></p>

            <form id="booking-form">
                <div class="input-group">
                    <label for="booking-date">Data</label>
                    <input id="booking-date" type="date" class="input-field" required>
                </div>

                <div style="margin: 20px 0; display: flex; flex-direction: column; gap: 10px;">
                    <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer;">
                        <input id="is-recurring" type="checkbox" style="width: 18px; height: 18px;">
                        Repetir semanalmente
                    </label>
                    <div id="recurring-fields" class="input-group" hidden>
                        <label for="end-date">Repetir ate</label>
                        <input id="end-date" type="date" class="input-field">
                    </div>
                </div>

                <button class="btn-primary" type="submit" style="margin-top: 10px;">Confirmar</button>
            </form>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/logos.js"></script>
    <script src="js/agendar.js"></script>
</body>
</html>
